<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create your PrimePay account">
<title>PrimePay | Create Account</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #020617;
    --panel: #08101f;
    --border: rgba(148, 163, 184, 0.16);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #2563eb;
    --danger: #f87171;
    --success: #4ade80;
}

body {
    min-height: 100vh;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.10), transparent 30%),
        var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
}

a {
    color: inherit;
    text-decoration: none;
}

.topbar {
    width: 100%;
    padding: 22px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 1.25rem;
    font-weight: 800;
}

.logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: white;
    font-weight: 900;
    box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
}

.back-link {
    color: var(--muted);
    font-size: 0.9rem;
}

.back-link:hover {
    color: white;
}

main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 35px 20px 65px;
}

.register-wrapper {
    width: 100%;
    max-width: 480px;
}

.heading {
    text-align: center;
    margin-bottom: 26px;
}

.heading h1 {
    font-size: clamp(2rem, 5vw, 2.55rem);
    letter-spacing: -1.2px;
    margin-bottom: 10px;
}

.heading p {
    color: var(--muted);
    line-height: 1.6;
    font-size: 0.95rem;
}

.card {
    background: linear-gradient(
        145deg,
        rgba(15, 23, 42, 0.96),
        rgba(8, 16, 31, 0.98)
    );
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 32px;
    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
}

.alert {
    display: none;
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    line-height: 1.5;
}

.alert.error {
    display: block;
    background: rgba(239, 68, 68, 0.09);
    border: 1px solid rgba(248, 113, 113, 0.22);
    color: #fca5a5;
}

.alert.success {
    display: block;
    background: rgba(34, 197, 94, 0.08);
    border: 1px solid rgba(74, 222, 128, 0.20);
    color: #86efac;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #e2e8f0;
    font-size: 0.88rem;
    font-weight: 650;
}

input {
    width: 100%;
    height: 51px;
    padding: 0 15px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    background: rgba(2, 6, 23, 0.7);
    color: var(--text);
    outline: none;
    font-size: 0.94rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input::placeholder {
    color: #64748b;
}

input:focus {
    border-color: rgba(56, 189, 248, 0.65);
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.08);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 70px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 650;
}

.toggle-password:hover {
    color: white;
}

.password-strength {
    margin-top: 8px;
    height: 4px;
    width: 100%;
    border-radius: 10px;
    background: rgba(148, 163, 184, 0.10);
    overflow: hidden;
}

.password-strength-bar {
    width: 0;
    height: 100%;
    transition: width 0.25s ease;
}

.password-hint {
    margin-top: 7px;
    color: #64748b;
    font-size: 0.74rem;
}

.terms {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 20px 0 23px;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.5;
}

.terms input {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin-top: 2px;
    accent-color: var(--accent-2);
}

.terms a {
    color: var(--accent);
}

.register-btn {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: white;
    font-size: 0.96rem;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(37, 99, 235, 0.20);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

.register-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 16px 32px rgba(37, 99, 235, 0.28);
}

.register-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 25px 0;
    color: #64748b;
    font-size: 0.78rem;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
}

.login-text {
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
}

.login-text a {
    color: var(--accent);
    font-weight: 700;
}

.login-text a:hover {
    text-decoration: underline;
}

.security-note {
    margin-top: 20px;
    text-align: center;
    color: #64748b;
    font-size: 0.75rem;
    line-height: 1.5;
}

.security-icon {
    color: var(--success);
}

footer {
    text-align: center;
    padding: 20px;
    color: #475569;
    font-size: 0.76rem;
}

@media (max-width: 520px) {
    .topbar {
        padding: 18px 5%;
    }

    .back-link {
        display: none;
    }

    main {
        padding: 25px 16px 50px;
    }

    .card {
        padding: 24px 20px;
        border-radius: 18px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="logo" aria-label="PrimePay home">
        <span class="logo-mark">P</span>
        <span>PrimePay</span>
    </a>

    <a href="index.html" class="back-link">← Back to PrimePay</a>
</header>

<main>
    <div class="register-wrapper">

        <div class="heading">
            <h1>Create your account</h1>
            <p>Join PrimePay and build your business around reliable payment infrastructure.</p>
        </div>

        <section class="card">

            <div id="alert" class="alert"></div>

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="160"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            Show
                        </button>
                    </div>

                    <div class="password-strength">
                        <div
                            class="password-strength-bar"
                            id="strengthBar"
                        ></div>
                    </div>

                    <div class="password-hint" id="strengthText">
                        Use at least 8 characters.
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleConfirmPassword"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>

                    <span>
                        I agree to use PrimePay responsibly and accept the
                        <a href="#" onclick="return false;">Terms</a>
                        and
                        <a href="#" onclick="return false;">Privacy Policy</a>.
                    </span>
                </label>

                <button
                    type="submit"
                    class="register-btn"
                    id="registerBtn"
                >
                    Create account
                </button>

            </form>

            <div class="divider">
                <span>PrimePay</span>
            </div>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

        </section>

        <div class="security-note">
            <span class="security-icon">●</span>
            Your account is created through the PrimePay API.
        </div>

    </div>
</main>

<footer>
    © <span id="year"></span> PrimePay. All rights reserved.
</footer>

<script src="js/config.js"></script>
<script>
const API_URL = window.PRIMEPAY_API_URL;

const form = document.getElementById("registerForm");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const termsInput = document.getElementById("terms");
const registerBtn = document.getElementById("registerBtn");
const alertBox = document.getElementById("alert");
const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

document.getElementById("year").textContent = new Date().getFullYear();

function showAlert(message, type = "error") {
    alertBox.textContent = message;
    alertBox.className = "alert " + type;
}

function clearAlert() {
    alertBox.textContent = "";
    alertBox.className = "alert";
}

function setupPasswordToggle(buttonId, input) {
    document.getElementById(buttonId).addEventListener("click", () => {
        const visible = input.type === "text";

        input.type = visible ? "password" : "text";
        document.getElementById(buttonId).textContent = visible ? "Show" : "Hide";
    });
}

setupPasswordToggle("togglePassword", passwordInput);
setupPasswordToggle("toggleConfirmPassword", confirmPasswordInput);

passwordInput.addEventListener("input", () => {
    const password = passwordInput.value;

    let score = 0;

    if (password.length >= 8) score++;
    if (password.length >= 12) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    if (!password) {
        strengthBar.style.width = "0";
        strengthText.textContent = "Use at least 8 characters.";
        return;
    }

    if (score <= 2) {
        strengthBar.style.width = "30%";
        strengthText.textContent = "Weak password.";
    } else if (score <= 4) {
        strengthBar.style.width = "65%";
        strengthText.textContent = "Moderate password.";
    } else {
        strengthBar.style.width = "100%";
        strengthText.textContent = "Strong password.";
    }
});

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    clearAlert();

    const name = nameInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!name) {
        showAlert("Please enter your full name.");
        nameInput.focus();
        return;
    }

    if (name.length < 2) {
        showAlert("Your name must contain at least 2 characters.");
        nameInput.focus();
        return;
    }

    if (!email || !email.includes("@")) {
        showAlert("Please enter a valid email address.");
        emailInput.focus();
        return;
    }

    if (password.length < 8) {
        showAlert("Your password must contain at least 8 characters.");
        passwordInput.focus();
        return;
    }

    if (password !== confirmPassword) {
        showAlert("The passwords do not match.");
        confirmPasswordInput.focus();
        return;
    }

    if (!termsInput.checked) {
        showAlert("Please accept the terms before creating your account.");
        return;
    }

    registerBtn.disabled = true;
    registerBtn.textContent = "Creating account...";

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);

    try {
        const response = await fetch(`${API_URL}/auth/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                email,
                password
            }),
            signal: controller.signal
        });

        let data = {};

        try {
            data = await response.json();
        } catch {
            throw new Error("The server returned an invalid response.");
        }

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to create your account."
            );
        }

        if (data.token && data.user) {
            localStorage.setItem("primepay_token", data.token);
            localStorage.setItem(
                "primepay_user",
                JSON.stringify(data.user)
            );
        }

        showAlert(
            "Account created successfully. Redirecting...",
            "success"
        );

        setTimeout(() => {
            window.location.href = data.token
                ? "merchant/onboarding.html"
                : "login.html";
        }, 700);

    } catch (error) {
        if (error.name === "AbortError") {
            showAlert("The server took too long to respond. Please try again.");
        } else if (error instanceof TypeError) {
            showAlert(
                "Unable to connect to the PrimePay API. Make sure the backend is running."
            );
        } else {
            showAlert(
                error.message || "Unable to create your account."
            );
        }

        registerBtn.disabled = false;
        registerBtn.textContent = "Create account";

    } finally {
        clearTimeout(timeout);
    }
});
</script>

</body>
</html>
